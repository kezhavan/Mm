<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pink Paradise ✨</title>
<style>
:root{--pink:#ff78ad;--deep:#a83d76;--cream:#fff8fb;--lav:#c8a6ff;--mint:#baf4df}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#713c60;background:radial-gradient(circle at 15% 10%,#fff 0,#ffe6f1 34%,#f2e7ff 72%,#dffbf2 100%);display:flex;justify-content:center;padding:16px 12px 28px;overflow-x:hidden}
.wrap{width:min(100%,440px)}.top{text-align:center}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:800;color:#c05d91}.title{font-size:clamp(32px,9vw,46px);line-height:1.05;margin:5px 0;color:#b74780;text-shadow:0 3px 0 #fff}.subtitle{font-size:14px;color:#98688a;margin:8px 0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:#ffffffbd;border:1px solid #fff;border-radius:18px;padding:10px 6px;box-shadow:0 5px 15px #bd78a51a;text-align:center}.stat small{display:block;font-size:11px;font-weight:800;letter-spacing:1px;color:#a77a9a}.stat strong{font-size:23px;color:#a83d76}.panel{background:#ffffffa8;border:1px solid #fff;border-radius:25px;padding:12px;box-shadow:0 15px 35px #b77db51f;backdrop-filter:blur(8px)}.goal{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin:1px 3px 10px}.progress{height:8px;background:#f7d8e8;border-radius:20px;overflow:hidden;margin:0 3px 12px}.bar{height:100%;width:0;background:linear-gradient(90deg,#ff82b4,#c7a1ff,#8fe2c6);border-radius:20px;transition:width .25s}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;touch-action:manipulation}.tile{aspect-ratio:1;border:0;border-radius:14px;background:linear-gradient(145deg,#fff,#ffeaf4);box-shadow:inset 0 -3px 0 #f6c9df,0 2px 4px #a34e7917;display:grid;place-items:center;font-size:clamp(22px,6.2vw,31px);padding:0;cursor:pointer;transition:transform .12s,filter .12s;user-select:none;-webkit-tap-highlight-color:transparent}.tile:active{transform:scale(.91)}.tile.selected{outline:3px solid #d783f4;outline-offset:1px;transform:scale(.94);background:#f7eaff}.tile.matched{animation:pop .22s ease}.tile:disabled{cursor:default}@keyframes pop{50%{transform:scale(.65);opacity:.3}}.hint{text-align:center;font-size:12px;color:#9c7193;margin:12px 4px 2px}.actions{display:flex;gap:9px;margin-top:12px}.btn{flex:1;border:0;border-radius:16px;padding:12px;font-weight:800;font-size:14px;color:white;background:linear-gradient(100deg,#ff78ad,#c18aff);box-shadow:0 5px 0 #df8bb9;cursor:pointer}.btn.secondary{background:#fff;color:#b14c83;box-shadow:0 4px 0 #f0c9df;border:1px solid #fff}.footer{text-align:center;font-size:11px;color:#b17c9e;margin-top:15px}.overlay{position:fixed;inset:0;background:#64365566;display:none;align-items:center;justify-content:center;padding:22px;z-index:5}.overlay.show{display:flex}.modal{width:min(100%,350px);background:linear-gradient(155deg,#fff9fc,#f6eaff);border:2px solid white;border-radius:28px;padding:26px 20px;text-align:center;box-shadow:0 20px 60px #54234145;animation:appear .25s ease}.modal .emoji{font-size:56px}.modal h2{color:#b74780;font-size:30px;margin:6px 0}.quote{font-size:17px;line-height:1.5;color:#8c5279;margin:12px 0 20px}.sparkles{font-size:19px;letter-spacing:8px}@keyframes appear{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
</style></head><body><main class="wrap"><header class="top"><div class="eyebrow">A LITTLE DOSE OF MAGIC</div><h1 class="title">Pink Paradise ✨</h1><p class="subtitle">Match cute things. Make your day sparkle. 💗</p></header>
<section class="stats"><div class="stat"><small>✨ SCORE</small><strong id="score">0</strong></div><div class="stat"><small>🎯 TARGET</small><strong id="target">500</strong></div><div class="stat"><small>💌 MOVES</small><strong id="moves">20</strong></div></section>
<section class="panel"><div class="goal"><span>🌸 Collect the sparkle!</span><span id="left">500 to go</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="board" id="board" aria-label="Match three game board"></div><div class="hint">Tap one tile, then a neighbour to swap. Match 3 or more! 💕</div></section>
<div class="actions"><button class="btn" id="newGame">↻ New Game</button><button class="btn secondary" id="how">How to play 💡</button></div><div class="footer">made with a little extra love ♡</div></main>
<div class="overlay" id="overlay"><div class="modal"><div class="sparkles">✦ ✧ ✦</div><div class="emoji" id="modalEmoji">💖</div><h2 id="modalTitle">You did it!</h2><p class="quote" id="modalQuote"></p><button class="btn" id="again">Play again ✨</button></div></div>
<script>
(()=>{const icons=['🍓','🧁','💖','🌸','🦋','🍬'];const boardEl=document.getElementById('board');let cells=[],selected=-1,score=0,moves=20,locked=false,ended=false;const target=500;const $=id=>document.getElementById(id);const quotesWin=[['💗','You’re a little bit of magic.','Keep shining, cutie. The world needs your sparkle! ✨'],['🌷','Pretty, powerful, unstoppable.','You made it happen, one sweet move at a time. 💕'],['🦋','Main character energy!','Your smile is your superpower. Never forget that. 🌸'],['🎀','Sweet victory!','You deserve all the lovely things life has to offer. 💌'],['🌈','You make life brighter.','A tiny reminder: you are more than enough. 💖']];const quotesLose=[['🌼','One more try?','Even flowers take time to bloom. You’ve got this! 🌷'],['🫶','You’re doing lovely.','A little pause, a deep breath, and one more try. 💗']];
function randomIcon(){return Math.floor(Math.random()*icons.length)}function findMatches(){let set=new Set();for(let r=0;r<7;r++)for(let c=0;c<7;c++){let i=r*7+c,v=cells[i];if(c<5&&v===cells[i+1]&&v===cells[i+2]){let j=c;while(j<7&&cells[r*7+j]===v){set.add(r*7+j);j++}}if(r<5&&v===cells[i+7]&&v===cells[i+14]){let j=r;while(j<7&&cells[j*7+c]===v){set.add(j*7+c);j++}}}return [...set]}
function createBoard(){cells=[];for(let i=0;i<49;i++){let v=randomIcon();while((i%7>=2&&cells[i-1]===v&&cells[i-2]===v)||(i>=14&&cells[i-7]===v&&cells[i-14]===v))v=randomIcon();cells.push(v)}render()}
function render(){boardEl.innerHTML='';cells.forEach((v,i)=>{let b=document.createElement('button');b.className='tile'+(i===selected?' selected':'');b.textContent=icons[v];b.setAttribute('aria-label',icons[v]);b.addEventListener('click',()=>tap(i));boardEl.appendChild(b)});$('score').textContent=score;$('moves').textContent=moves;$('bar').style.width=Math.min(100,score/target*100)+'%';$('left').textContent=Math.max(0,target-score)+' to go'}
function tap(i){if(locked||ended)return;if(selected===-1){selected=i;render();return}if(selected===i){selected=-1;render();return}let a=selected,b=i;selected=-1;if(Math.abs(a-b)===7||(Math.floor(a/7)===Math.floor(b/7)&&Math.abs(a-b)===1)){[cells[a],cells[b]]=[cells[b],cells[a]];let matches=findMatches();if(matches.length){moves--;render();resolve()}else{[cells[a],cells[b]]=[cells[b],cells[a]];render();}}else{selected=i;render()}}
function resolve(){locked=true;let m=findMatches();if(!m.length){locked=false;render();if(score>=target)finish(true);else if(moves<=0)finish(false);return}score+=m.length*10;m.forEach(i=>cells[i]=-1);render();setTimeout(()=>{for(let c=0;c<7;c++){let vals=[];for(let r=6;r>=0;r--){let v=cells[r*7+c];if(v!==-1)vals.push(v)}while(vals.length<7)vals.push(randomIcon());for(let r=6;r>=0;r--)cells[r*7+c]=vals[6-r]}render();setTimeout(resolve,100)},180)}
function finish(win){ended=true;let q=(win?quotesWin:quotesLose)[Math.floor(Math.random()*(win?quotesWin:quotesLose).length)];$('modalEmoji').textContent=win?'🏆 '+q[0]:q[0];$('modalTitle').textContent=win?'You did it! ✨':q[1];$('modalQuote').textContent=win?q[1]+' '+q[2]:q[2];$('again').textContent=win?'Play again 💖':'Try again 🌸';$('overlay').classList.add('show')}
function reset(){score=0;moves=20;selected=-1;locked=false;ended=false;$('overlay').classList.remove('show');createBoard()}$('newGame').onclick=reset;$('again').onclick=reset;$('how').onclick=()=>{if(!ended){$('modalEmoji').textContent='🍬';$('modalTitle').textContent='How to play';$('modalQuote').textContent='Tap a tile, then tap a tile next to it. Match 3 or more of the same cute icons to score points. Reach 500 points before your 20 moves run out! 💗';$('again').textContent='Got it! ✨';$('overlay').classList.add('show');$('again').onclick=()=>{$('overlay').classList.remove('show');$('again').onclick=reset}}};createBoard();})();
</script></body></html>
