<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111126">
<title>Fruit Frenzy 🍉</title>
<style>
:root{--pink:#ff4f9a;--yellow:#ffd166;--mint:#6ef3c5;--ink:#17152d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111126;color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}body{background:radial-gradient(ellipse at 50% 0%,#33225a 0,#17152d 55%,#0c0c1b 100%)}#app{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:auto;padding:12px 14px 16px;gap:10px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:clamp(20px,5vw,30px);font-weight:1000;letter-spacing:-1px}.brand span{color:var(--yellow)}.pill{background:#ffffff12;border:1px solid #ffffff22;border-radius:15px;padding:8px 12px;font-weight:800;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{border:1px solid #ffffff1b;background:#ffffff0c;border-radius:15px;padding:9px;text-align:center}.stat small{display:block;color:#bcb8d7;font-size:11px;font-weight:700;letter-spacing:1px}.stat strong{font-size:22px}.arena{position:relative;flex:1;min-height:250px;border:1px solid #ffffff22;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#211a42aa,#111126aa);box-shadow:inset 0 0 40px #0004}.arena:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff16 1px,transparent 1px);background-size:24px 24px;pointer-events:none}canvas{position:absolute;width:100%;height:100%;inset:0;touch-action:none}.bottom{display:flex;align-items:center;justify-content:space-between;color:#aaa6c9;font-size:12px;gap:10px}.btn{border:0;border-radius:16px;background:linear-gradient(135deg,var(--pink),#ff7c68);color:white;font-weight:1000;font-size:16px;padding:14px 20px;box-shadow:0 8px 22px #ff4f9a35;cursor:pointer}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#0c0b1bd9;backdrop-filter:blur(7px);z-index:5;text-align:center}.panel{max-width:340px}.emoji{font-size:64px;filter:drop-shadow(0 8px 15px #ff4f9a33)}h1{font-size:clamp(27px,7vw,42px);line-height:1.02;margin:8px 0 12px;letter-spacing:-1px}p{color:#c8c3df;line-height:1.5;font-size:14px}.rules{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0}.rules span{background:#ffffff12;border:1px solid #ffffff1c;border-radius:12px;padding:8px 10px;font-size:12px}.hidden{display:none!important}.flash{animation:flash .2s}@keyframes flash{50%{background:#ff4f9a55}}.progress{height:5px;background:#ffffff19;border-radius:9px;overflow:hidden;margin-top:7px}.progress div{height:100%;width:100%;background:linear-gradient(90deg,var(--mint),var(--yellow));transform-origin:left}
</style></head><body><main id="app"><header class="top"><div class="brand">🍉 FRUIT <span>FRENZY</span></div><div class="pill">⚡ SWIPE TO SLICE</div></header><section class="stats"><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>BEST</small><strong id="best">0</strong></div><div class="stat"><small>LIVES</small><strong id="lives">❤️❤️❤️</strong></div></section><section class="arena" id="arena"><canvas id="game"></canvas><div class="overlay" id="overlay"><div class="panel"><div class="emoji" id="hero">🍉🍊🍓</div><h1 id="headline">Ready to<br><span style="color:#ffd166">slice?</span></h1><p id="desc">Swipe your finger across flying fruits. Chain slices for combo points — but don't hit the bombs!</p><div class="rules"><span>🍓 Fruit = points</span><span>💣 Bomb = lose a life</span><span>⏱️ 45 seconds</span></div><button class="btn" id="start">LET'S PLAY ✨</button></div></div></section><div class="progress"><div id="timebar"></div></div><footer class="bottom"><span>👆 Drag across fruit to slice</span><span id="hint">Combo x1</span></footer></main>
<script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),arena=document.getElementById('arena');const $=id=>document.getElementById(id);let W=0,H=0,items=[],particles=[],trail=[],score=0,lives=3,time=45,last=0,spawn=0,running=false,prev=null,combo=1,comboUntil=0,best=Number(localStorage.getItem('fruitFrenzyBest')||0),raf=0; $('best').textContent=best;
const fruits=[['🍉',12],['🍊',10],['🍓',15],['🍍',18],['🍋',10],['🍇',14],['🥝',12],['🍑',16],['🍒',15],['🥭',18]];
function resize(){let r=arena.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function hud(){ $('score').textContent=score; $('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);$('hint').textContent='Combo x'+combo;$('timebar').style.transform=`scaleX(${Math.max(0,time/45)})` }
function start(){items=[];particles=[];trail=[];score=0;lives=3;time=45;spawn=0;combo=1;comboUntil=0;running=true;prev=null;$('overlay').classList.add('hidden');hud();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function end(){running=false;const won=score>=100;const winQuotes=['“You’re a little chaos wrapped in sunshine. 🍓”','“Sweet things happen when you keep going. ✨”','“You sliced your way into my hall of fame. 🏆”','“Some people make the world brighter… you just made this game sweeter. 💖”','“Cute, clever, and dangerously good at this. 🍉”','“You’re the plot twist that makes a good day great. 🌈”'];const tryQuotes=['“Every miss is just a setup for your comeback. 💫”','“Keep going, superstar. Your next round could be legendary! ⭐”','“Even the sweetest strawberries need another try. 🍓”'];const quote=(won?winQuotes:tryQuotes)[Math.floor(Math.random()*(won?winQuotes:tryQuotes).length)];$('hero').textContent=won?'🏆💖':'🍉💫';$('headline').innerHTML=won?'YOU<br><span style="color:#ffd166">WON!</span>':'TIME’S<br><span style="color:#ffd166">UP!</span>';$('desc').textContent=`${quote} You scored ${score} points${score>best?' — new personal best!':''}. ${won?'Send this win to your friend 😎':'One more round? You’ve got this!'}`;$('start').textContent='PLAY AGAIN ↻';$('overlay').classList.remove('hidden');if(score>best){best=score;localStorage.setItem('fruitFrenzyBest',best);$('best').textContent=best}}
function spawnWave(){let count=1+(Math.random()<.48?1:0)+(Math.random()<.18?1:0);for(let i=0;i<count;i++){let bomb=Math.random()<.13;let f=fruits[Math.floor(Math.random()*fruits.length)];items.push({x:W*(.13+Math.random()*.74),y:H+30+Math.random()*40,r:21+Math.random()*9,emoji:bomb?'💣':f[0],value:bomb?0:f[1],bomb,vx:(Math.random()-.5)*3.5,vy:-H*(.68+Math.random()*.25)/1.05-Math.random()*2,rot:Math.random()*6,vr:(Math.random()-.5)*.1,cut:false})}}
function burst(x,y,color){for(let i=0;i<13;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*4,life:1,color})}}
function segmentDist(px,py,x1,y1,x2,y2){let dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/l)):0;return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))}
function pointer(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{if(!running)return;canvas.setPointerCapture?.(e.pointerId);prev=pointer(e);trail.push({...prev,t:performance.now()})});canvas.addEventListener('pointermove',e=>{if(!running||!prev)return;let p=pointer(e);trail.push({...p,t:performance.now()});for(let o of items){if(o.cut)continue;if(segmentDist(o.x,o.y,prev.x,prev.y,p.x,p.y)<o.r+8){o.cut=true;if(o.bomb){lives--;combo=1;burst(o.x,o.y,'#ff435e');arena.classList.remove('flash');void arena.offsetWidth;arena.classList.add('flash');if(navigator.vibrate)navigator.vibrate(90)}else{let now=performance.now();combo=now<comboUntil?Math.min(combo+1,5):1;comboUntil=now+850;score+=o.value*combo;burst(o.x,o.y,['#ff6b9a','#ffd166','#6ef3c5','#9b8cff'][Math.floor(Math.random()*4)]);if(navigator.vibrate)navigator.vibrate(15)}}}prev=p;hud()});function stopPointer(){prev=null}canvas.addEventListener('pointerup',stopPointer);canvas.addEventListener('pointercancel',stopPointer);
function loop(now){if(!running)return;let dt=Math.min((now-last)/16.67,2);last=now;time-=dt/60;if(time<=0||lives<=0){time=Math.max(0,time);hud();end();return}spawn-=dt;if(spawn<=0){spawnWave();spawn=Math.max(13,34-score/18)}ctx.clearRect(0,0,W,H);for(let o of items){o.x+=o.vx*dt;o.y+=o.vy*dt;o.vy+=.13*dt;o.rot+=o.vr*dt;ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.font=`${o.r*1.75}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=o.bomb?'#ff284c':'#ff4f9a';ctx.shadowBlur=o.bomb?18:9;ctx.fillText(o.emoji,0,0);ctx.restore();if(!o.cut&&o.y>H+50&&o.vy>0&&!o.bomb){o.cut=true;lives--;hud()}}
items=items.filter(o=>o.y<H+90&&!o.cut);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.08*dt;p.life-=.025*dt;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);trail=trail.filter(p=>now-p.t<170);if(trail.length>1){ctx.lineCap='round';for(let i=1;i<trail.length;i++){ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.strokeStyle=`rgba(255,255,255,${i/trail.length*.85})`;ctx.lineWidth=2+i/trail.length*7;ctx.shadowColor='#ff4f9a';ctx.shadowBlur=12;ctx.stroke()}ctx.shadowBlur=0}if(now>comboUntil)combo=1;hud();raf=requestAnimationFrame(loop)}$('start').addEventListener('click',start);hud();
})();
</script></body></html>
